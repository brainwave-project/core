name: Publish to GitHub Packages

# Runs automatically on every push to main.
# Can also be triggered manually from the Actions tab (useful when you need
# to force-republish after fixing a packaging issue without a new commit).

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node + GitHub Packages registry
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: '@brainwave-project'

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: npm run build

      - name: Publish
        # --no-git-checks : skip dirty-tree check (dist/ is gitignored but present after build)
        # --access public : required for scoped packages on GitHub Packages
        # || true        : tolerate "already exists" so re-running on the same version is safe
        run: npm publish --no-git-checks --access public || true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
