name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write       # create tags + GitHub Release
  issues: write         # comment on issues
  pull-requests: write  # comment on PRs
  packages: write       # publish to GitHub Packages ← this was missing

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # semantic-release needs full git history

      - name: Setup Node + GitHub Packages registry
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # Telling setup-node about the registry makes it write an .npmrc
          # that wires NODE_AUTH_TOKEN automatically — no manual config needed
          registry-url: https://npm.pkg.github.com
          scope: '@brainwave-project'

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test --if-present

      - name: Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # @semantic-release/npm reads NPM_TOKEN — point it at the same GITHUB_TOKEN
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
